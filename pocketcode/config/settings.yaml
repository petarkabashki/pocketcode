llm:
  providers:
    gemini:
      api_key: ${GEMINI_API_KEY}
      use_vertexai: false
      # Vertex AI mode (OAuth/ADC) example:
      # use_vertexai: true
      # project: your-gcp-project-id
      # location: global
    # OpenAI-compatible providers:
    # - string value: API key only
    # - object value: { api_key: "...", base_url: "https://..." }
    openai: ""
    openrouter: ""
    xai: ""
    requesty: ""

  profiles:
    gemini_default:
      provider: gemini
      model: gemini-2.5-pro-preview-02-25
      parameters:
        temperature: 0.4
        max_output_tokens: 4096

    gemini_pro:
      provider: gemini
      model: gemini-2.5-pro-preview-02-25
      parameters:
        temperature: 0.4
        max_output_tokens: 4096

    gemini_fast:
      provider: gemini
      model: gemini-2.5-flash
      parameters:
        temperature: 0.2
        max_output_tokens: 3072

  default_profile: gemini_default

runtime:
  log_level: INFO
  # Internal runtime graph used to execute agent turns.
  agent_runtime_workflow: single_agent
  default_agent: Ask
  llm_overrides:
    agents: {}
    nodes: {}
    handoffs: {}
  llm_pricing: {}
  storage:
    session_state_dir: .pocketstate
    entry_history_dir: .pockethist

  # Canonical discovery surface.
  # Relative paths are resolved from the current workspace directory.
  # Each entry is either one namespace root or one flat namespace pack root.
  workspace_paths: []
    - .github

  require_tool_confirmation: true
  auto_approved_tools: []
  auto_confirm_tools: false
  tool_confirmation:
    default_policy: confirm
    tool_policies: {}
    agent_policies: {}
