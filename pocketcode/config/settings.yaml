llm:
  providers:
    gemini:
      api_key: ${GEMINI_API_KEY}
      use_vertexai: false
      # Vertex AI mode (OAuth/ADC) example:
      # use_vertexai: true
      # project: your-gcp-project-id
      # location: global
    # OpenAI-compatible providers:
    # - string value: API key only
    # - object value: { api_key: "...", base_url: "https://..." }
    openai: ""
    openrouter: ""
    xai: ""
    requesty: ""

  profiles:
    gemini_default:
      provider: gemini
      model: gemini-2.5-pro-preview-02-25
      parameters:
        temperature: 0.4
        max_output_tokens: 4096

    gemini_pro:
      provider: gemini
      model: gemini-2.5-pro-preview-02-25
      parameters:
        temperature: 0.4
        max_output_tokens: 4096

    gemini_fast:
      provider: gemini
      model: gemini-2.5-flash
      parameters:
        temperature: 0.2
        max_output_tokens: 3072

  default_profile: gemini_default

runtime:
  log_level: INFO
  default_workflow: orchestrator
  default_agent: asker
  llm_overrides:
    agents: {}
    nodes: {}
    handoffs: {}
  llm_pricing: {}

  # Relative paths are resolved from the current workspace directory.
  # Each path can be either:
  # 1) a folder containing plugin subfolders, or
  # 2) a direct plugin folder with plugin.yaml
  plugin_paths:
    - .pocketcode/plugins

  require_tool_confirmation: true
  auto_approved_tools: []
  auto_confirm_tools: false
  tool_confirmation:
    default_policy: confirm
    tool_policies: {}
    agent_policies: {}
