name: core
description: Built-in plugin with unified components for agents and workflows.

tools:
  read_file: pocketcode.tools.filesystem.ReadFileTool
  write_to_file: pocketcode.tools.filesystem.WriteToFileTool
  list_files: pocketcode.tools.filesystem.ListFilesTool
  create_directory: pocketcode.tools.filesystem.CreateDirectoryTool
  glob_files: pocketcode.tools.filesystem.GlobFilesTool
  search_code: pocketcode.tools.search.SearchCodeTool
  execute_command: pocketcode.tools.system.ExecuteCommandTool
  ask_user_input: pocketcode.tools.user_input.AskUserInputTool
  confirm_user_input: pocketcode.tools.user_input.ConfirmUserInputTool
  git_status: pocketcode.tools.git.GitStatusTool
  git_diff: pocketcode.tools.git.GitDiffTool
  git_add: pocketcode.tools.git.GitAddTool
  git_commit: pocketcode.tools.git.GitCommitTool
  git_pull: pocketcode.tools.git.GitPullTool
  git_push: pocketcode.tools.git.GitPushTool

node_definitions:
  default_start:
    kind: start
  default_tool:
    kind: tool
  default_handoff:
    kind: handoff
  default_output:
    kind: output
  default_end:
    kind: end

components:
  koder:
    kind: agent
    description: Code implementation and editing specialist.
    llm_profile: gemini_default
    tools:
      - read_file
      - write_to_file
      - list_files
      - create_directory
      - glob_files
      - search_code
      - execute_command
      - git_status
      - git_diff
      - git_add
      - git_commit
      - git_pull
      - git_push
    handoff_agents:
      - arkitekt
      - asker
    prompt_file: prompts/agents/koder.md

  arkitekt:
    kind: agent
    description: Architecture and planning specialist.
    llm_profile: gemini_default
    tools:
      - read_file
      - list_files
      - glob_files
      - search_code
    handoff_agents:
      - koder
      - asker
    prompt_file: prompts/agents/arkitekt.md

  asker:
    kind: agent
    description: Repository Q&A specialist.
    llm_profile: gemini_fast
    tools:
      - read_file
      - list_files
      - glob_files
      - search_code
    handoff_agents:
      - koder
      - arkitekt
    prompt_file: prompts/agents/asker.md

  micromanager:
    kind: agent
    description: Orchestrator for delegation and handoffs.
    llm_profile: gemini_default
    tools:
      - read_file
      - list_files
      - glob_files
      - search_code
    handoff_agents:
      - koder
      - arkitekt
      - asker
    prompt_file: prompts/agents/micromanager.md

  orchestrator:
    kind: workflow
    path: workflows/orchestrator.md

  single_agent:
    kind: workflow
    path: workflows/single_agent.md
