schema_version: 1
name: core
description: Built-in plugin with unified components for agents and workflows.

tools:
  read_file: tools/filesystem.py:ReadFileTool
  write_to_file: tools/filesystem.py:WriteToFileTool
  list_files: tools/filesystem.py:ListFilesTool
  create_directory: tools/filesystem.py:CreateDirectoryTool
  glob_files: tools/filesystem.py:GlobFilesTool
  search_code: tools/search.py:SearchCodeTool
  execute_command: tools/system.py:ExecuteCommandTool
  ask_user_input: tools/user_input.py:AskUserInputTool
  confirm_user_input: tools/user_input.py:ConfirmUserInputTool
  git_status: tools/git.py:GitStatusTool
  git_diff: tools/git.py:GitDiffTool
  git_add: tools/git.py:GitAddTool
  git_commit: tools/git.py:GitCommitTool
  git_pull: tools/git.py:GitPullTool
  git_push: tools/git.py:GitPushTool

agents:
  react:
    description: >
      General-purpose ReAct agent. Reasons, calls core tools, and observes
      results in a Reason -> Act -> Observe loop until a final answer is reached.
    module: agents/react_agent.py
    entry_fn: create_flow
    llm_profile: gemini_default
    tools:
      - read_file
      - write_to_file
      - list_files
      - create_directory
      - glob_files
      - search_code
      - execute_command
      - ask_user_input
      - confirm_user_input
      - git_status
      - git_diff
      - git_add
      - git_commit
      - git_pull
      - git_push
