schema_version: 1
name: core
description: Built-in plugin with the default tools and runtime agents.

tools:
  read_file: tools/filesystem.py:ReadFileTool
  write_to_file: tools/filesystem.py:WriteToFileTool
  list_files: tools/filesystem.py:ListFilesTool
  create_directory: tools/filesystem.py:CreateDirectoryTool
  glob_files: tools/filesystem.py:GlobFilesTool
  search_code: tools/search.py:SearchCodeTool
  execute_command: tools/system.py:ExecuteCommandTool
  ask_user_input: tools/user_input.py:AskUserInputTool
  ask_user_buttons: tools/user_input.py:AskUserButtonsTool
  ask_user_radio_group: tools/user_input.py:AskUserRadioGroupTool
  ask_user_checklist: tools/user_input.py:AskUserChecklistTool
  confirm_user_input: tools/user_input.py:ConfirmUserInputTool

flows:
  react:
    description: >
      General-purpose ReAct agent. Reasons, calls core tools, and observes
      results in a Reason -> Act -> Observe loop until a final answer is reached.
    module: agents/react_agent.py
    entry_fn: create_flow
    llm_profile: gemini_default
    tools:
      - read_file
      - write_to_file
      - list_files
      - create_directory
      - glob_files
      - search_code
      - execute_command
      - ask_user_input
      - ask_user_buttons
      - ask_user_radio_group
      - ask_user_checklist
      - confirm_user_input
      - workspace_git::git_status
      - workspace_git::git_diff
      - workspace_git::git_add
      - workspace_git::git_commit
      - workspace_git::git_pull
      - workspace_git::git_push
      - workspace_context::read_context_elephant_store_file
      - workspace_context::write_context_elephant_store_file
      - workspace_context::append_to_context_elephant_store_file
      - workspace_context::get_context_elephant_store_summary
      - workspace_context::check_context_elephant_store_status
