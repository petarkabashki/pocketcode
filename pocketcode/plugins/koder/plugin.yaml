schema_version: 1
name: "koder"
description: "Expert developer agent that writes code, creates files, and applies patches."

tools:
  write_to_file: "tools/filesystem.py:WriteToFileTool"
  create_directory: "tools/filesystem.py:CreateDirectoryTool"
  git_diff: "tools/git.py:GitDiffTool"

agents:
  koder:
    module: "agents/koder_agent.py"
    entry_fn: "create_flow"
    description: "Expert software developer. Writes and edits code, creates files, applies diffs, and debugs issues."
    tools: [write_to_file, create_directory, git_diff]
    prompts: ["prompts/system.md"]
