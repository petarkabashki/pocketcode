llm:
  providers:
    gemini:
      api_key: AIzaSyAnm5RBw5MGgQ7svMzZP8qMadTnMAeE4cI
      use_vertexai: false
    openai: ''
    openrouter: ''
    xai: ''
    requesty: ''
  profiles:
    gemini-3.1-flash-lite-preview:
      provider: gemini
      model: gemini-3.1-flash-lite-preview
      parameters:
        temperature: 0.4
        max_output_tokens: 4096
    gemini-3.1-pro-preview:
      provider: gemini
      model: gemini-3.1-pro-preview
      parameters:
        temperature: 0.4
        max_output_tokens: 4096
    gemini-3-pro-preview:
      provider: gemini
      model: gemini-3-pro-preview
      parameters:
        temperature: 0.2
        max_output_tokens: 3072
    gemini-3-flash-preview:
      provider: gemini
      model: gemini-3-flash-preview
      parameters:
        temperature: 0.2
        max_output_tokens: 3072
  default_profile: gemini-3.1-pro-preview
runtime:
  log_level: INFO
  default_agent: core.react
  llm_overrides:
    agents: {}
    nodes: {}
    handoffs: {}
  llm_pricing: {}
  plugin_paths:
  - .pocketcode/plugins
  require_tool_confirmation: true
  auto_approved_tools: []
  auto_confirm_tools: false
  tool_confirmation:
    default_policy: confirm
    tool_policies:
      core.ask_user_checklist: allow
    agent_policies: {}
  textual:
    last_used:
      agent_profiles:
        my-react:
          tools:
          - core.ask_user_buttons
          - core.ask_user_checklist
          - core.ask_user_input
          - core.ask_user_radio_group
          - core.confirm_user_input
          - core.glob_files
          - core.list_files
          - core.read_file
          - core.search_code
          - core.select_filesystem_entry
          - core.stage_text_replace
      active_profile: my-react
      global_llm_profile: gemini-3-flash-preview
    theme_name: forest
    workspace_mode: control_desk
