runtime:
  log_level: INFO
  default_agent: core.react
  llm_overrides:
    agents: {}
    nodes: {}
    handoffs: {}
  llm_pricing: {}
  plugin_paths:
  - .pocketcode/plugins
  require_tool_confirmation: true
  auto_approved_tools: []
  auto_confirm_tools: false
  tool_confirmation:
    default_policy: confirm
    tool_policies:
      core.ask_user_checklist: allow
    agent_policies: {}
  textual:
