schema_version: 1
name: asker
description: Clarification plugin with user-input tools, prompts, flows, and composite agents.

tools:
  ask_user: tools/user_input.py:AskUserInputTool

flows:
  ask:
    description: Repository Q&A and clarification specialist.
    module: flows/ask.py
    entry_fn: create_flow
    llm_profile: gemini_fast
    tools:
      - ask_user
      - core::read_file
      - core::list_files
      - core::glob_files
      - core::search_code
    handoff_agents:
      - coder::coder
      - architect::architect
    prompts:
      - prompts/system.md
