schema_version: 1
name: workspace_builder
description: Workspace authoring flow for creating and editing plugin resources and workspace-level assets.

flows:
  plugin_builder:
    description: Create and edit workspace plugin resources and workspace-level assets such as flows, prompts, agents, tools, skills, and related docs.
    module: flows/plugin_builder.py
    entry_fn: create_flow
    llm_profile: gemini_default
    tools:
      - core::read_file
      - core::write_to_file
      - core::list_files
      - core::create_directory
      - core::glob_files
      - core::select_filesystem_entry
      - core::extract_text
      - core::stage_text_replace
      - core::apply_staged_edit
      - core::cancel_staged_edit
      - core::search_code
      - core::execute_command
      - core::ask_user_input
      - workspace_git::git_status
      - workspace_git::git_diff
    prompts:
      - prompts/system.md
